security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\AppAuthenticator

            logout:
                path: app_logout
                # target: app_login

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
    # 🔓 Panier PUBLIC (même non connecté)
    - { path: ^/panier, roles: PUBLIC_ACCESS }

    # 🔓 Détail produit PUBLIC (exception)
    - { path: ^/produit/detail/\d+$, roles: PUBLIC_ACCESS, methods: [GET] }

    # 🔒 Tout le reste de /produit → ADMIN
    - { path: ^/produit, roles: ROLE_ADMIN }

    # 🔒 Catégories → ADMIN
    - { path: ^/admin/category, roles: ROLE_ADMIN }

        # 🔓 Le reste est public (login, register, home…)

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
